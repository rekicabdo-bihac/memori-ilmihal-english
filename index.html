<style>
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(145deg,#0b2118,#17452f);color:#fff;min-height:100vh}
header{padding:20px 16px 10px;text-align:center}h1{margin:0;color:#ffd66b;font-size:clamp(25px,6vw,40px)}.sub{opacity:.9;margin:6px}

button{font:inherit}.lesson{min-height:76px;border:1px solid #d8b45b;border-radius:16px;background:#fff;color:#173225;padding:10px;font-weight:750;box-shadow:0 5px 12px #0004}

.card{min-height:105px;border:0;border-radius:14px;background:#d8b45b;color:#13261d;padding:7px;font-weight:800;box-shadow:0 4px 10px #0005;transform-style:preserve-3d}
.card.hidden{color:transparent;background:linear-gradient(135deg,#d5aa3f,#ffe8a1);position:relative}
.card.hidden:after{content:"✦";color:#173225;font-size:30px;position:absolute;inset:0;display:grid;place-items:center}
.card.matched{background:#dff5df;color:#15361d;opacity:.8}.msg{text-align:center;font-size:20px;font-weight:850;margin:14px}
#orderBox{display:none;background:#ffffff12;border:1px solid #ffffff33;border-radius:16px;padding:14px;margin-top:14px}.orderItem{background:#fff;color:#173225;padding:12px;margin:8px 0;border-radius:12px;font-weight:750;touch-action:none}

<body>
<header><h1>GREAT MEMORY GAME – ILMIHAL</h1><div class="sub">Choose a lesson and find all matching pairs</div><div class="sub"><b>Prepared by Abdo ef. Rekić</b></div></header>

<section id="home"><div id="menu" class="menu"></div></section>

 <div class="bar"><button class="back" onclick="home()">← Lessons</button><div id="gameTitle" class="stats"></div><div id="stats" class="stats"></div></div>
 <div id="grid" class="grid"></div><div id="msg" class="msg"></div>
 <div id="orderBox"><h2>Arrange the verses in the correct order</h2><p>Tap the verses in order, from the first to the last.</p><div id="orderItems"></div><button class="action" onclick="resetOrder()">Try again</button></div>
</section>
</main><footer>For Android • iPhone • computer</footer>
<script>

uharram"], ["Mawlid", "12 Rabi al-Awwal"], ["Eid al-Fitr", "1, 2, and 3 Shawwal"], ["Eid al-Adha", "10, 11, 12, and 13 Dhul-Hijjah"]]}, {"title": "Pillars of Islam", "pairs": [["Shahadah", "Testimony of faith"], ["Salah", "Perform the five daily prayers"], ["Fasting in Ramadan", "Fast during the month of Ramadan"], ["Zakat", "Give the prescribed portion of one's wealth"], ["Hajj", "Make pilgrimage to the Ka'bah if able"]]}, {"title": "Dhikr After Salah", "pairs": [["Dhikr", "Remembering Allah and mentioning Him"], ["After the final salam", "We recite dhikr after salah"], ["Subhanallah", "Glory be to Allah"], ["El-hamdu lillah", "Praise be to Allah"], ["Allahu ekber", "Allah is the Greatest"], ["Dhikr After Salah", "Salawat, Ayat al-Kursi, and tasbih"]]}, {"title": "Surah Al-Ikhlas", "pairs": [["Kul huvallahu ehad", "Say: He is Allah, the One!"], ["Allahus-samed", "Allah is the refuge of all!"], ["Lem jelid ve lem juled", "He neither begets nor is born"], ["Ve lem jekun lehu kufuven ehad", "And there is none equal to Him"]]}, {"title": "Surah Al-Falaq", "pairs": [["Kul e'uzu birabbil-felek", "Say: I seek refuge in the Lord of daybreak"], ["Min šerri ma halek", "From the evil of what He created"], ["Ve min šerri gasikin iza vekab", "And from the evil of darkness when it settles"], ["Ve min šerrin-neffasati fil-'ukad", "And from the evil of those who blow on knots"], ["Ve min šerri hasidin iza hased", "And from the evil of an envier when he envies"]]}, {"title": "Surah An-Nas", "pairs": [["Kul e'uzu birabbin-nas", "Say: I seek refuge in the Lord of mankind"], ["Melikin-nas", "The King of mankind"], ["Ilahin-nas", "The God of mankind"], ["Min šerril-vesvasil-hannas", "From the evil of the retreating whisperer"], ["Ellezi juvesvisu fi sudurin-nas", "Who whispers evil into the hearts of mankind"], ["Minel-džinneti ven-nas", "From among jinn and mankind"]]}, {"title": "Surah Al-Masad", "pairs": [["Tebbet jeda ebi lehebin ve tebb", "May the hands of Abu Lahab perish, and he has perished!"], ["Ma agna 'anhu maluhu ve ma keseb", "His wealth and what he earned will not benefit him"], ["Sejasla naren zate leheb", "He will enter a blazing Fire"], ["Vemre'etuhu hammaletel-hatab", "And his wife, the carrier of firewood"], ["Fi džidiha hablun min mesed", "Around her neck will be a rope of palm fiber"]]}, {"title": "Surah An-Nasr", "pairs": [["Iza džae nasrullahi vel-feth", "When Allah's help and victory come"], ["Ve re'ejten-nase jedhulune fi dinillahi efvadža", "And you see people entering Allah's religion in crowds"], ["Fesebbih bihamdi rabbike vestagfirh", "Glorify your Lord with praise and ask Him for forgiveness"], ["Innehu kane tevvaba", "Indeed, He is ever Accepting of repentance"]]}, {"title": "Articles of Faith", "pairs": [["Amentu billahi", "I believe in Allah"], ["Ve melaiketihi", "I believe in Allah's angels"], ["Ve kutubihi", "I believe in Allah's Books"], ["Ve rusulihi", "I believe in Allah's messengers"], ["Vel-jevmil-ahiri", "I believe in the Last Day"], ["Ve bil-kaderi hajrihi ve šerrihi minallahi te'ala", "I believe that everything that happens is by Allah's decree"]]}, {"title": "Allahu Rabbi", "pairs": [["Allahu Rabbi", "Allah is my Lord"], ["Muhammedun nebijji", "Muhammad is my Prophet"], ["El-Islamu dini", "Islam is my religion"], ["El-Kur'anu kitabi", "The Qur'an is my Book"], ["El-Ka'betu kibleti", "The Ka'bah is my qiblah"], ["El-mu'minune ihveti", "The believers are my brothers and sisters"]]}, {"title": "Subhanaka", "pairs": [["Subhanakallahumme", "Glory be to You, O Allah"], ["Ve bi hamdike", "Praise belongs to You"], ["Ve tebarekesmuke", "Blessed is Your Name"], ["Ve te'ala džedduke", "Exalted is Your Majesty"], ["Ve la ilahe gajruke", "There is no god but You"]]}, {"title": "Surah Al-Fatihah", "pairs": [["Bismillahir-Rahmanir-Rahim", "In the name of Allah, the Most Compassionate, the Most Merciful"], ["El-hamdu lillahi rabbil-'alemin", "All praise is for Allah, Lord of all worlds"], ["Er-Rahmanir-Rahim", "The Most Compassionate, the Most Merciful"], ["Maliki jevmid-din", "Master of the Day of Judgment"], ["Ijjake na'budu ve ijjake neste'in", "You alone we worship, and You alone we ask for help"], ["Ihdinas-siratal-mustekim", "Guide us to the Straight Path"], ["Siratal-lezine en'amte alejhim gajril-magdubi alejhim ve led-dallin", "The path of those You have blessed, not those who earned anger, nor those who went astray"]]}, {"title": "Adhan", "pairs": [["Allahu ekber", "Allah is the Greatest"], ["Ešhedu en la ilahe illellah", "I bear witness that there is no god but Allah"], ["Ešhedu enne Muhammeden resulullah", "I bear witness that Muhammad is the Messenger of Allah"], ["Hajje ales-salah", "Come to prayer"], ["Hajje alel-felah", "Come to success"], ["La ilahe illellah", "There is no god but Allah"]]}, {"title": "Religious Obligations – 33", "pairs": [["Religious obligations", "33 obligations in total"], ["Articles of Faith", "6"], ["Pillars of Islam", "5"], ["Obligatory acts of wudu", "4"], ["Obligatory acts of tayammum", "3 of tayammum"], ["Obligatory acts of ghusl", "3 of ghusl"], ["Conditions of Salah", "12"], ["6 + 5 + 4 + 3 + 3 + 12", "33 religious obligations"]]}, {"title": "Salawat", "pairs": [["Allahumme salli ala Muhammedin ve ala ali Muhammed", "O Allah, bestow Your mercy upon Muhammad and the family of Muhammad"], ["Kema sallejte ala Ibrahime ve ala ali Ibrahim", "As You bestowed Your mercy upon Ibrahim and the family of Ibrahim"], ["Inneke hamidun medžid", "Indeed, You are Praiseworthy and Glorious"], ["Allahumme barik ala Muhammedin ve ala ali Muhammed", "O Allah, bless Muhammad and the family of Muhammad"], ["Kema barekte ala Ibrahime ve ala ali Ibrahim", "As You blessed Ibrahim and the family of Ibrahim"]]}, {"title": "Dua After Salawat", "pairs": [["Rabbena atina fid-dunja haseneten", "Our Lord, grant us good in this world"], ["Ve fil-ahireti haseneten", "And good in the Hereafter"], ["Ve kina azaben-nar", "And protect us from the punishment of the Fire"], ["Rabbena-gfir li", "Our Lord, forgive me"], ["Ve li validejje", "And my parents"], ["Ve lil-mu'minine jevme jekumul-hisab", "And the believers on the Day the account is established"]]}, {"title": "Ayat al-Kursi", "pairs": [["Allahu la ilahe illa huvel-hajjul-kajjum", "Allah—there is no god but Him—the Ever-Living, All-Sustaining"], ["La te'huzuhu sinetun ve la nevm", "Neither drowsiness nor sleep overtakes Him"], ["Lehu ma fis-semavati ve ma fil-erd", "To Him belongs whatever is in the heavens and whatever is on the earth"], ["Men zellezi ješfe'u indehu illa bi iznih", "Who can intercede with Him except by His permission?"], ["Ja'lemu ma bejne ejdihim ve ma halfehum", "He knows what is before them and what is behind them"], ["Ve la juhitune bi šej'in min ilmihi illa bima ša'", "They encompass nothing of His knowledge except what He wills"], ["Vesi'a kursijjuhus-semavati vel-erd", "His Kursi extends over the heavens and the earth"], ["Ve la je'uduhu hifzuhuma", "Their preservation does not tire Him"], ["Ve huvel-alijjul-azim", "He is the Most High, the Magnificent"]]}, {"title": "Preparation for Salah", "pairs": [["Clean body, clothing, and place", "1st condition for salah"], ["Abdest", "Ritual purification before salah"], ["Gusul", "Washing the entire body when required"], ["Tayammum", "Symbolic purification when water cannot be used"], ["Proper clothing", "3rd condition for salah"], ["4th condition for salah", "Perform salah on time"], ["5th condition for salah", "Face the Qiblah"], ["Make the intention", "6th condition for salah"]]}, {"title": "At-Tahiyyat", "pairs": [["Et-tehijjatu lillahi ves-salavatu vet-tajjibatu", "All greetings, prayers, and good deeds belong to Allah"], ["Es-selamu alejke ejjuhen-nebijju ve rahmetullahi ve berekatuhu", "Peace, Allah's mercy, and blessings be upon you, O Prophet"], ["Es-selamu alejna ve ala ibadillahis-salihin", "Peace be upon us and upon Allah's righteous servants"], ["Ešhedu en la ilahe illellah", "I bear witness that there is no god but Allah"], ["Ve ešhedu enne Muhammeden abduhu ve resuluhu", "And I bear witness that Muhammad is His servant and Messenger"]]}, {"title": "Iqamah", "pairs": [["Allahu ekber", "Allah is the Greatest"], ["Ešhedu en la ilahe illellah", "I bear witness that there is no god but Allah"], ["Ešhedu enne Muhammeden resulullah", "I bear witness that Muhammad is the Messenger of Allah"], ["Hajje ales-salah", "Come to prayer"], ["Hajje alel-felah", "Come to success"], ["Kad kametis-salah", "The prayer is beginning"]]}, {"title": "Prayer Times", "pairs": [["Fajr", "From dawn until sunrise"], ["Dhuhr", "From when the sun passes its highest point until Asr"], ["Asr", "From when the sun inclines westward until just before sunset"], ["Maghrib", "From sunset until Isha"], ["Isha", "When night has fully fallen"]]}, {"title": "Hasbi Rabbi", "pairs": [["Hasbi Rabbi džellallah", "My Lord, Allah the Exalted, is sufficient for me"], ["Ma fi kalbi gajrullah", "There is none in my heart except Allah"], ["Nur Muhammed sallallah", "Muhammad is a light; may Allah's blessings be upon him"], ["La ilahe illellah", "There is no god but Allah"]]}, {"title": "Fajr Prayer", "pairs": [["Fajr Sunnah", "2 rak'ahs of Sunnah"], ["Fajr Fard", "2 rak'ahs of Fard"], ["First performed", "Fajr Sunnah"], ["After the Sunnah", "Fajr Fard"], ["Total Fajr prayer", "4 rak'ahs"]]}, {"title": "Islamic Manners", "pairs": [["Salam", "Islamic greeting"], ["Es-selamu alejkum", "Peace be upon you"], ["Ve alejkumus-selam", "And peace be upon you"], ["Parents", "We respect them and obey them in what is good"], ["Elders", "We treat them with respect"], ["Younger people", "We are gentle and caring toward them"]]}, {"title": "Islamic New Year", "pairs": [["Hijrah", "The migration of Muhammad, peace be upon him, from Makkah to Madinah"], ["Hijri calendar", "Begins with the Hijrah"], ["First Hijri month", "Muharram"], ["Hijri year", "Has 12 months"]]}, {"title": "Appropriate Words in Different Situations", "pairs": [["Bismillāh", "In the name of Allah – when we begin something."], ["Inšallāh", "If Allah wills – when we hope for something."], ["Māšallāh", "What Allah has willed – when we admire something."], ["Subhanallāh", "Glory be to Allah – when we are amazed or impressed."], ["El-hamdu lillāh", "Praise be to Allah – on every occasion."], ["Jerhamukellāh", "May Allah have mercy on you – when we hear someone sneeze."], ["Ja Allāh", "O Allah – when we are in pain or difficulty."], ["Estagfirullāh", "I seek Allah's forgiveness – when we repent for a bad deed."], ["Ne'uzubillāhi", "We seek Allah's protection – when referring to something bad."]]}, {"title": "Islamic Etiquette of Eating and Drinking", "pairs": [["Food", "Eat healthy and halal—permissible—food."], ["Before eating", "Wash your hands."], ["Before starting to eat", "Recite A'udhu billah and Bismillah."], ["How do we eat?", "With the right hand."], ["Who do we eat with?", "Together with the family."], ["Food rule", "Do not eat very hot food and do not blow on food."], ["After eating", "Thank Allah by saying: Al-hamdu lillah – praise be to Allah."], ["After the meal", "Clear the table."], ["At the end", "Brush your teeth after eating."]]}];
let lesson=null, opened=[], lock=false, found=0, moves=0, orderChosen=[];
const menu=document.getElementById('menu'), grid=document.getElementById('grid');
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
lessons.forEach((l,i)=>{let b=document.createElement('button');b.className='lesson';b.textContent=(i+1)+'. '+l.title+' ('+l.pairs.length+' pairs)';b.onclick=()=>start(i);menu.appendChild(b)})
function start(i){
 lesson=lessons[i]; opened=[];found=0;moves=0;lock=false;
 document.getElementById('home').style.display='none';document.getElementById('game').style.display='block';
 document.getElementById('gameTitle').textContent=lesson.title;document.getElementById('msg').textContent='';
 document.getElementById('orderBox').style.display='none';
 let cards=[]; lesson.pairs.forEach((p,k)=>{cards.push({k,t:p[0]},{k,t:p[1]})});shuffle(cards);
 grid.innerHTML=''; cards.forEach(c=>{let b=document.createElement('button');b.className='card hidden';b.dataset.k=c.k;b.dataset.t=c.t;b.textContent=c.t;b.onclick=()=>flip(b);grid.appendChild(b)});stat()
}
function flip(b){
 if(lock||!b.classList.contains('hidden'))return;b.classList.remove('hidden');opened.push(b);
 if(opened.length===2){moves++;lock=true;let [a,c]=opened;
  if(a.dataset.k===c.dataset.k){setTimeout(()=>{a.classList.add('matched');c.classList.add('matched');opened=[];found++;lock=false;stat();if(found===lesson.pairs.length)win()},350)}
  else setTimeout(()=>{a.classList.add('hidden');c.classList.add('hidden');opened=[];lock=false;stat()},850)
 } stat()
}
function stat(){document.getElementById('stats').textContent='Pairs: '+found+'/'+(lesson?lesson.pairs.length:0)+' • Attempts: '+moves}
function win(){
 document.getElementById('msg').textContent='🎉 Well done! You found all the matching pairs!';
 if(/^Sura /.test(lesson.title)){document.getElementById('orderBox').style.display='block';resetOrder()}
}
function resetOrder(){
 orderChosen=[];let box=document.getElementById('orderItems');box.innerHTML='';
 let arr=lesson.pairs.map((p,i)=>({i,t:p[0]}));shuffle(arr);
 arr.forEach(x=>{let d=document.createElement('button');d.className='orderItem';d.textContent=x.t;d.onclick=()=>chooseOrder(d,x.i);box.appendChild(d)})
}
function chooseOrder(el,i){
 if(el.disabled)return; let expected=orderChosen.length;
 if(i===expected){el.disabled=true;el.style.opacity=.45;orderChosen.push(i);if(orderChosen.length===lesson.pairs.length)document.getElementById('msg').textContent='🌟 Excellent! The verses are arranged in the correct order.'}
 else{document.getElementById('msg').textContent='Try again – choose the next verse in order.'}
}
function home(){document.getElementById('game').style.display='none';document.getElementById('home').style.display='block';window.scrollTo(0,0)}
</script></body></html>
